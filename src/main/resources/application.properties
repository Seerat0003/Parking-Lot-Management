spring.application.name=parkinglot

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chehak}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${LOCAL_DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
